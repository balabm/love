version: "3.8"

services:
  love-api:
    build: .
    container_name: love-api
    ports:
      - "8000:8000"
    environment:
      - LOVE_ENV=production
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./data:/app/data
      - ./core:/app/core
      - ./api:/app/api
    depends_on:
      - ollama
      - chromadb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/evolution/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ollama:
    image: ollama/ollama:latest
    container_name: love-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  chromadb:
    image: chromadb/chroma:latest
    container_name: love-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

  love-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: love-ui
    ports:
      - "5173:5173"
    depends_on:
      - love-api
    restart: unless-stopped

volumes:
  ollama-models:
  chroma-data:
